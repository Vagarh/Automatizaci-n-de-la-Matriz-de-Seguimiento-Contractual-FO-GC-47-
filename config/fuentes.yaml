    aplica_si: {complejidad: ["BAJA COMPLEJIDAD"], modalidad: ["CAPITA", "CÁPITA"]}
    columnas_esperadas:
      - "MES"
      - "MUNICIPIO"
      - "META INDICADOR"
      - "RESULTADO DEL INDICADOR"
      - "NUMERADOR (Número de personas atendidas en extramuralidad)"
      - "DENOMINADOR (Número total de personas proyectadas en el periodo)"
