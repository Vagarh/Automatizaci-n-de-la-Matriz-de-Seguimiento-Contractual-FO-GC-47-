    llave_matriz: [reps, cups]
    valor: "PFAFS"
    metas:
      hoja: "METAS"
      fila_encabezado: 1
      llave: "CUPS"                  # col B
      columna_meta: "META en días"  # col F
    columnas_esperadas:
      - "MES"
      - "MUNICIPIO"
      - "NIT IPS"
      - "CÓDIGO HABILITACIÓN IPS"
      - "RAZÓN SOCIAL"
      - "CUPS"
      - "TOTAL CITAS ASIGNADAS"
      - "PFAFS"
    destino:
      GB: "META REPORTA 1552 -> 'Reporta'"
      GC: "REPORTA -> 'Si'"
      GD: "CUMPLIMIENTO -> 'Satisfactorio' si reporta >=1"
      "GE..JA": "tripletas META/PFAFS/CUMPL por CUPS (ver encabezados de General: 890201, 890203, 890283, 890266, 890250O, 890235, 815103, 130003, 890208, 361605, 890246, 890247, 890294, 890273, 890280, 890228, 890244, 890275, 890281, 890250G, 890240, ayuda dx, 890243, 890242, psiquiatría 890284)"
    estado: pendiente
    nota:
      - "1276 filas. Encabezado REAL en la fila 17 (las 16 primeras son el membrete del formato FO-RS-90 y el glosario de siglas)."
      - "Cruce por CÓDIGO HABILITACIÓN IPS (12 díg, = REPS de sede) + CUPS. NUNCA por NIT."
      - "Un contrato -> N sedes -> N códigos de habilitación. Necesita resolvedor NIT<->REPS<->sede (bloqueo abierto)."
      - "La hoja METAS mapea CUPS -> meta en días. Las metas también están embebidas en los encabezados de General (GE, GH, GK...)."
      - "Si un contrato reporta >=1 CUPS: GB='Reporta', GC='Si', GD='Satisfactorio'."

