  # -------------------------------------------------------------- PLANIFICACIÓN FAMILIAR
  planificacion_familiar:
    archivos:
      expertasalud:
        archivo_glob: "INDICADORES IPS EXPERTASALUD *.xlsx"
        hoja: "RESULTADO INDICADORES 2025"
        fila_encabezado: 2            # f1 '1. INDICADOR', f2 'INDICADOR 1: ...'/'META'/'NUMERADOR'/'DENOMINADOR'
        llave: ["NÚMERO DE CONTRATO"]
      salud_reproductiva:
        archivo_glob: "INDICADORES IPS SALUD REPRODUCTIVA *.xlsx"
        hoja: "Indicadores contrato 2025"
        fila_encabezado: 2            # (aquí f1 es un título; encabezados en f2, sub-encabezados en f3)
        llave: ["NÚMERO DE CONTRATO"]
    filtro_fila: {"MES DE REPORTE": "{MES_NOMBRE_UP}"}   # 'JULIO'
    llave_matriz: numero_contrato
    filtro_categoria: null           # CORRECCIÓN: el FO-GC-47 decía 'MOS y ayudas ortopédicas' (error)
    destino: "KC:LC  (8-9 indicadores)"
    estado: pendiente
    nota:
      - "Contratos: 0217-2022 (Expertasalud / IPS AMBULATORIA DE COLOMBIA) y 0443-2025 (Salud Reproductiva SAS)."
      - "Layout ancho: bloques de 4 columnas por indicador (INDICADOR n / META / NUMERADOR / DENOMINADOR)."
      - "Filtrar la fila del mes en curso ('MES DE REPORTE'). Filas futuras traen #DIV/0!."
      - "Expertasalud: 8 indicadores. Salud Reproductiva: 9. General mapea las tripletas KC..LC."

  # -------------------------------------------------------------- AYUDAS DIAGNÓSTICAS
  ayudas_diagnosticas:
    carpeta: "Reporte Ayudas DX"
    archivo_glob: "*"
    llave: ["numero_contrato", "nombre_ips"]
    llave_matriz: [numero_contrato, contratista]
    destino: "LD:NH  (banda más grande de la matriz)"
    estado: manual
    nota:
      - "23 archivos, uno por prestador, con estructuras TOTALMENTE distintas entre sí:"
      - "  - varios con hoja 'DETALLE_1552_Art_2' (41..65 columnas, miles de filas de detalle CUPS)"
      - "  - otros con hojas ad-hoc: 'INDICADORES 2026', 'IMAGENES', 'Mamografias', 'INDICADORES UVDXM', 'RS-0427-2026'..."
      - "  - 1 archivo .xls legacy ('Oportunidad Savia IMECO.xls') -> requiere xlrd o conversión."
      - "Indicaciones.txt: 'son los más complejos, hay prestadores con 1 indicador y otros con 5 o más'."
      - "Si un prestador no envía a la fecha de impresión -> se deja sin medición."
      - "Automatización realista: un parser por FAMILIA de plantilla, no uno por archivo. Fase posterior."

  # -------------------------------------------------------------- CAMPAÑAS EXTRAMURAL
  extramuralidad:
    archivo_glob: "Formato de indicadores extramuralidad *.xlsx"
    hoja: "JULIO"
    fila_encabezado: 1
    fila_datos_inicio: 2
    llave: ["MUNICIPIO"]
